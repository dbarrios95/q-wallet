" fill="#64748B">100 solicitudes / 5 min</text><text x="470.0" y="510" text-anchor="middle" font-size="15" fill="#64748B">por IP (CTRL-17)</text><text x="470.0" y="530" text-anchor="middle" font-size="15" fill="#64748B">Se enciende en pruebas</text><rect x="640" y="300" width="260" height="300" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/><text x="770.0" y="326" text-anchor="middle" font-weight="bold" font-size="17" fill="#0F172A">API Gateway REST</text><text x="770.0" y="350" text-anchor="middle" font-size="14" fill="#64748B">Endpoint regional</text><text x="770.0" y="370" text-anchor="middle" font-size="14" fill="#64748B">Solo TLS 1.3 (STRICT)</text><text x="770.0" y="390" text-anchor="middle" font-size="14" fill="#64748B">SecurityPolicy_TLS13_1_3</text><text x="770.0" y="410" text-anchor="middle" font-size="14" fill="#64748B">_2025_09 (CTRL-08)</text><text x="770.0" y="430" text-anchor="middle" font-size="14" fill="#64748B">Authorizer de Cognito:</text><text x="770.0" y="450" text-anchor="middle" font-size="14" fill="#64748B">firma, vigencia y scope</text><text x="770.0" y="470" text-anchor="middle" font-size="14" fill="#64748B">qwallet/api del token</text><text x="770.0" y="490" text-anchor="middle" font-size="14" fill="#64748B">Throttling 10/s, ráfaga 20</text><text x="770.0" y="510" text-anchor="middle" font-size="14" fill="#64748B">Errores genéricos (CTRL-13)</text><text x="770.0" y="530" text-anchor="middle" font-size="14" fill="#64748B">Logs de acceso sin tokens</text><rect x="985" y="110" width="230" height="64" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/><text x="1100.0" y="136" text-anchor="middle" font-weight="bold" font-size="17" fill="#0F172A">svc-profile</text><text x="1100.0" y="160" text-anchor="middle" font-size="13" fill="#64748B">rol IAM qwallet-svc-profile</text><rect x="985" y="192" width="230" height="64" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/><text x="1100.0" y="218" text-anchor="middle" font-weight="bold" font-size="17" fill="#0F172A">svc-accounts</text><text x="1100.0" y="242" text-anchor="middle" font-size="13" fill="#64748B">rol IAM qwallet-svc-accounts</text><rect x="985" y="274" width="230" height="64" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/><text x="1100.0" y="300" text-anchor="middle" font-weight="bold" font-size="17" fill="#0F172A">svc-transfers</text><text x="1100.0" y="324" text-anchor="middle" font-size="13" fill="#64748B">rol IAM qwallet-svc-transfers</text><rect x="985" y="356" width="230" height="64" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/><text x="1100.0" y="382" text-anchor="middle" font-weight="bold" font-size="17" fill="#0F172A">svc-budgets</text><text x="1100.0" y="406" text-anchor="middle" font-size="13" fill="#64748B">rol IAM qwallet-svc-budgets</text><rect x="985" y="438" width="230" height="64" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/><text x="1100.0" y="464" text-anchor="middle" font-weight="bold" font-size="17" fill="#0F172A">svc-admin</text><text x="1100.0" y="488" text-anchor="middle" font-size="13" fill="#64748B">rol IAM qwallet-svc-admin</text><text x="1100" y="540" text-anchor="middle" font-size="14" font-weight="normal" fill="#64748B">Cada función: su propio rol</text><text x="1100" y="560" text-anchor="middle" font-size="14" font-weight="normal" fill="#64748B">con límite de permisos (CTRL-12)</text><text x="1100" y="580" text-anchor="middle" font-size="14" font-weight="normal" fill="#64748B">y valida el dueño del recurso</text><text x="1100" y="600" text-anchor="middle" font-size="14" font-weight="normal" fill="#64748B">con el sub del token (CTRL-01)</text><text x="1100" y="630" text-anchor="middle" font-size="14" font-weight="normal" fill="#64748B">Imágenes en ECR (CTRL-11)</text><rect x="1305" y="100" width="250" height="230" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/><text x="1430.0" y="126" text-anchor="middle" font-weight="bold" font-size="17" fill="#0F172A">DynamoDB</text><text x="1430.0" y="150" text-anchor="middle" font-size="14" fill="#64748B">8 tablas por tipo de dato</text><text x="1430.0" y="170" text-anchor="middle" font-size="14" fill="#64748B">perfiles · pin · cuentas</text><text x="1430.0" y="190" text-anchor="middle" font-size="14" fill="#64748B">movimientos · transferencias</text><text x="1430.0" y="210" text-anchor="middle" font-size="14" fill="#64748B">beneficiarios · presupuestos</text><text x="1430.0" y="230" text-anchor="middle" font-size="14" fill="#64748B">auditoría</text><text x="1430.0" y="250" text-anchor="middle" font-size="14" fill="#64748B">AES-256 con la CMK</text><text x="1430.0" y="270" text-anchor="middle" font-size="14" fill="#64748B">PITR y protección de borrado</text><rect x="1305" y="370" width="250" height="150" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/><text x="1430.0" y="396" text-anchor="middle" font-weight="bold" font-size="17" fill="#0F172A">AWS KMS</text><text x="1430.0" y="420" text-anchor="middle" font-size="15" fill="#64748B">alias/qwallet-datos</text><text x="1430.0" y="440" text-anchor="middle" font-size="15" fill="#64748B">CMK simétrica AES-256</text><text x="1430.0" y="460" text-anchor="middle" font-size="15" fill="#64748B">Rotación anual</text><text x="1430.0" y="480" text-anchor="middle" font-size="15" fill="#64748B">(CTRL-19)</text><rect x="1305" y="560" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/><text x="1430.0" y="586" text-anchor="middle" font-weight="bold" font-size="17" fill="#0F172A">SSM Parameter Store</text><text x="1430.0" y="610" text-anchor="middle" font-size="14" fill="#64748B">SecureString por servicio</text><text x="1430.0" y="630" text-anchor="middle" font-size="14" fill="#64748B">/qwallet/svc-*/ (CTRL-16)</text><rect x="350" y="790" width="290" height="150" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/><text x="495.0" y="816" text-anchor="middle" font-weight="bold" font-size="17" f
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" fill="#FFFFFF"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><text x="30" y="34" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#00A86B">1. FUENTES (CloudWatch Logs, cifrado con la CMK)</text><text x="410" y="34" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#00A86B">2. CORRELACIÓN</text><text x="760" y="34" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#00A86B">3. ALERTA Y RESPUESTA</text><rect x="30" y="52" width="330" height="92" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="44" y="76" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0F172A">CloudTrail (toda la cuenta)</text><text x="44" y="98" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Administración + invocaciones de Lambda</text><text x="44" y="116" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">/aws/cloudtrail/qwallet-auditoria</text><line x1="360" y1="98" x2="408" y2="98" stroke="#64748B" stroke-width="1.6" marker-end="url(#f)"/><rect x="30" y="164" width="330" height="92" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="44" y="188" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0F172A">API Gateway, log de acceso</text><text x="44" y="210" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">IP, usuario (sub), ruta, estado, WAF</text><text x="44" y="228" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">/aws/apigateway/qwallet-api</text><line x1="360" y1="210" x2="408" y2="210" stroke="#64748B" stroke-width="1.6" marker-end="url(#f)"/><rect x="30" y="276" width="330" height="92" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="44" y="300" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0F172A">5 Lambdas, logs JSON</text><text x="44" y="322" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">evento, código de rechazo, correlationId</text><text x="44" y="340" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">sin tokens ni PII (CTRL-09)</text><line x1="360" y1="322" x2="408" y2="322" stroke="#64748B" stroke-width="1.6" marker-end="url(#f)"/><rect x="30" y="388" width="330" height="92" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="44" y="412" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0F172A">AWS WAF (cuando está encendido)</text><text x="44" y="434" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">acción y regla que decidió</text><text x="44" y="452" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">aws-waf-logs-qwallet</text><line x1="360" y1="434" x2="408" y2="434" stroke="#64748B" stroke-width="1.6" marker-end="url(#f)"/><rect x="410" y="60" width="300" height="196" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="424" y="84" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0F172A">14 reglas (filtros de métrica)</text><text x="424" y="106" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Aplicación: PIN bloqueado o incorrecto,</text><text x="424" y="124" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">acceso prohibido, entrada inválida,</text><text x="424" y="142" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">error no controlado</text><text x="424" y="160" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Perímetro: 401, 429, bloqueo del WAF</text><text x="424" y="178" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Cuenta (CIS): IAM negado, root, consola</text><text x="424" y="196" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">sin MFA, auditoría/KMS/SIEM, IAM, Cognito</text><text x="424" y="214" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">→ métricas QWallet/Seguridad</text><rect x="410" y="280" width="300" height="160" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="424" y="304" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0F172A">5 consultas de correlación</text><text x="424" y="326" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Por correlationId (API Gateway + Lambda)</text><text x="424" y="344" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Rechazos por usuario e IP (BOLA, PIN)</text><text x="424" y="362" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">IPs sospechosas (401 + 429 + WAF)</text><text x="424" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Llamadas negadas por IAM, por rol</text><text x="424" y="398" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Bloqueos del WAF por regla e IP</text><line x1="710" y1="158" x2="758" y2="158" stroke="#64748B" stroke-width="1.6" marker-end="url(#f)"/><line x1="710" y1="360" x2="758" y2="420" stroke="#64748B" stroke-width="1.6" marker-end="url(#f)"/><rect x="760" y="60" width="310" height="196" rx="10" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.5"/><text x="774" y="84" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">10 alarmas de CloudWatch</text><text x="774" y="106" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#CBD5E1">Crítica: root, consola sin MFA,</text><text x="774" y="124" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#CBD5E1">cambios a auditoría, KMS o al SIEM</text><text x="774" y="142" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#CBD5E1">Alta: PIN bloqueado, acceso prohibido,</text><text x="774" y="160" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#CBD5E1">llamadas negadas por IAM</text><text x="774" y="178" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#CBD5E1">Media: errores, ráfagas de 401 y 429,</text><text x="774" y="196" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#CBD5E1">bloqueos del WAF</text><line x1="915" y1="256" x2="915" y2="290" stroke="#64748B" stroke-width="1.6" marker-end="url(#f)"/><rect x="760" y="292" width="310" height="70" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="774" y="316" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0F172A">Tema SNS cifrado → correo</text><text x="774" y="338" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">qwallet-alertas (solo alarmas de la cuenta)</text><rect x="760" y="380" width="310" height="70" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="774" y="404" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0F172A">Tablero qwallet-seguridad</text><text x="774" y="426" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">alarmas, reglas por fuente y consulta</text><rect x="760" y="468" width="310" height="70" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="774" y="492" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0F172A">Respuesta (sección 5.4)</text><text x="774" y="514" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">procedimiento por alarma, dueño: I1</text><text x="30" y="545" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Sin servidores propios: el SIEM usa servicios administrados de la cuenta (decisión del 31-oct-2026; Wazuh queda en el roadmap).</text></svg>
# Infraestructura de Q-Wallet: revisión, plan, despliegue y verificación.
# CTRL-21: AWS se alcanza solo con OIDC (sin llaves guardadas).
#   - Pull request: revisión estática (fmt, validate, Checkov, Dockerfile) y plan con
#     el rol de solo lectura qwallet-gha-plan.
#   - main (después del merge) o ejecución manual: despliegue con el rol
#     qwallet-gha-despliegue, solo desde el entorno "dev". El despliegue se detiene si
#     el plan destruye o reemplaza algo no aprobado (regla de borrado, CLAUDE.md).
#   - Después del despliegue: verificación de TLS 1.3, menor privilegio y cifrado;
#     el resultado queda como artefacto "evidencias-aws" (sin número de cuenta).
name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - "services/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "services/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  # El WAF se enciende o apaga con la variable de repositorio WAF_HABILITADO (true/false).
  TF_VAR_waf_habilitado: ${{ vars.WAF_HABILITADO == 'true' }}

jobs:
  revisar:
    name: Revisión estática (fmt, validate, Checkov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Formato
        run: terraform -chdir=infra fmt -check -recursive -diff

      - name: Validación
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: Checkov 3.3.22 sobre Terraform y Dockerfile (EVD-3-06)
        run: |
          pip install --quiet --break-system-packages checkov==3.3.22
          mkdir -p evidencias
          checkov --config-file infra/.checkov.yaml -d infra --framework terraform \
            --output cli --output junitxml --output-file-path console,evidencias \
            | tee evidencias/EVD-3-06_checkov_terraform.txt
          checkov -d services --framework dockerfile --skip-download --compact --output cli \
            | tee evidencias/EVD-3-06_checkov_dockerfile.txt

      - name: Imagen base de Lambda fijada por digest (CTRL-11)
        run: |
          actual=$(docker buildx imagetools inspect public.ecr.aws/lambda/nodejs:24 --format '{{json .Manifest.Digest}}' | tr -d '"')
          fijado=$(grep -o 'nodejs:24@sha256:[a-f0-9]*' services/hola/Dockerfile | cut -d@ -f2 || true)
          echo "Digest publicado hoy: ${actual}"
          echo "Digest en el Dockerfile: ${fijado:-ninguno}"
          echo "### Imagen base de Lambda" >> "$GITHUB_STEP_SUMMARY"
          echo "Publicado: \`${actual}\` · Fijado: \`${fijado:-ninguno}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$fijado" ]; then echo "::error::El Dockerfile no fija la imagen base por digest"; exit 1; fi
          if [ "$fijado" != "$actual" ]; then echo "::warning::Hay una imagen base más nueva; actualizar el digest en un PR"; fi

      - name: Construcción de la imagen (sin publicar)
        run: docker build -t qwallet-hola:prueba services/hola

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: revision-estatica
          path: evidencias/
          retention-days: 90

  plan:
    name: Plan de Terraform (solo lectura)
    needs: revisar
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Bootstrap hecho
        id: listo
        env:
          CUENTA: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "$CUENTA" ]; then
            echo "::notice::Falta el secreto AWS_ACCOUNT_ID (bootstrap de CloudShell). Se omite el plan."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.listo.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.listo.outputs.ok == 'true'
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.listo.outputs.ok == 'true'
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qwallet-gha-plan
          role-session-name: qwallet-plan-${{ github.run_id }}
          aws-region: us-east-1

      - name: Plan
        if: steps.listo.outputs.ok == 'true'
        run: |
          export TF_VAR_image_tag="svc-$(git rev-parse HEAD:services | cut -c1-12)"
          terraform -chdir=infra init -backend-config="bucket=qwallet-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"
          terraform -chdir=infra plan -lock=false -out=tfplan
          terraform -chdir=infra show -json tfplan > plan.json
          python3 infra/scripts/revisar_plan.py plan.json infra/destrucciones_aprobadas.txt

  desplegar:
    name: Despliegue en AWS (entorno dev)
    needs: revisar
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qwallet-gha-despliegue
          role-session-name: qwallet-despliegue-${{ github.run_id }}
          aws-region: us-east-1

      - name: Inicializar
        run: |
          echo "TF_VAR_image_tag=svc-$(git rev-parse HEAD:services | cut -c1-12)" >> "$GITHUB_ENV"
          terraform -chdir=infra init -backend-config="bucket=qwallet-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Repositorios de imágenes (primero, para poder publicar)
        run: |
          terraform -chdir=infra plan -target=aws_ecr_repository.servicio -target=aws_ecr_repository_policy.servicio -out=ecr.tfplan
          terraform -chdir=infra show -json ecr.tfplan > ecr.json
          python3 infra/scripts/revisar_plan.py ecr.json infra/destrucciones_aprobadas.txt
          terraform -chdir=infra apply ecr.tfplan

      - name: Publicar imágenes de los servicios
        run: |
          REGISTRO="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRO"
          construida=false
          for s in svc-profile svc-accounts svc-transfers svc-budgets svc-admin; do
            if aws ecr describe-images --repository-name "qwallet/${s}" --image-ids imageTag="$TF_VAR_image_tag" >/dev/null 2>&1; then
              echo "${s}: la imagen ${TF_VAR_image_tag} ya existe"
              continue
            fi
            if [ "$construida" = false ]; then
              docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load -t qwallet-hola:local services/hola
              construida=true
            fi
            docker tag qwallet-hola:local "${REGISTRO}/qwallet/${s}:${TF_VAR_image_tag}"
            docker push --quiet "${REGISTRO}/qwallet/${s}:${TF_VAR_image_tag}"
          done

      - name: Plan completo y revisión de destrucciones
        run: |
          terraform -chdir=infra plan -out=tfplan
          terraform -chdir=infra show -json tfplan > plan.json
          python3 infra/scripts/revisar_plan.py plan.json infra/destrucciones_aprobadas.txt

      - name: Aplicar
        run: terraform -chdir=infra apply tfplan

      - name: Verificar controles (EVD-3-11, EVD-3-12, EVD-3-13, EVD-5-04)
        env:
          SALIDA: evidencias
        run: |
          infra/scripts/verificar_aws.sh
          {
            echo "### Verificación"
            for f in evidencias/*.txt; do echo "- $(basename "$f")"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: evidencias-aws
          path: evidencias/
          retention-days: 90

# Infraestructura de Q-Wallet: revisión, plan, despliegue y verificación.
# CTRL-21: AWS se alcanza solo con OIDC (sin llaves guardadas).
#   - Pull request: revisión estática (fmt, validate, Checkov, Dockerfile) y plan con
#     el rol de solo lectura qwallet-gha-plan. El resultado se publica como comentario del PR.
#   - main (después del merge) o ejecución manual: despliegue con el rol
#     qwallet-gha-despliegue, solo desde el entorno "dev". El despliegue se detiene si
#     el plan destruye o reemplaza algo no aprobado (regla de borrado, CLAUDE.md).
#   - Después del despliegue: verificación de TLS 1.3, menor privilegio y cifrado.
#     La evidencia (sin número de cuenta) queda en el issue "Evidencias AWS" y como artefacto.
name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - "services/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "services/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  # El WAF se enciende o apaga con la variable de repositorio WAF_HABILITADO (true/false).
  TF_VAR_waf_habilitado: ${{ vars.WAF_HABILITADO == 'true' }}

jobs:
  revisar:
    name: Revisión estática (fmt, validate, Checkov)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Formato y validación
        run: |
          mkdir -p registro evidencias
          set -o pipefail
          {
            echo "== terraform fmt"
            terraform -chdir=infra fmt -check -recursive -diff
            echo "== terraform init (sin backend) y validate"
            terraform -chdir=infra init -backend=false -no-color
            terraform -chdir=infra validate -no-color
            git diff --exit-code infra/.terraform.lock.hcl
          } 2>&1 | tee registro/1_formato_validacion.txt

      - name: Checkov 3.3.22 sobre Terraform y Dockerfile (EVD-3-06)
        run: |
          set -o pipefail
          pip install --quiet --break-system-packages checkov==3.3.22
          checkov --config-file infra/.checkov.yaml -d infra --output cli --output junitxml \
            --output-file-path console,evidencias 2>&1 | tee evidencias/EVD-3-06_checkov_terraform.txt
          checkov -d services --framework dockerfile --skip-download --compact --output cli 2>&1 \
            | tee evidencias/EVD-3-06_checkov_dockerfile.txt

      - name: Imagen base de Lambda fijada por digest (CTRL-11)
        run: |
          actual=$(docker buildx imagetools inspect public.ecr.aws/lambda/nodejs:24 --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "Digest publicado hoy: ${actual}"
            for f in services/svc-*/Dockerfile; do
              fijado=$(grep -o 'nodejs:24@sha256:[a-f0-9]*' "$f" | cut -d@ -f2 || true)
              echo "${f}: ${fijado:-ninguno}"
              if [ -z "$fijado" ]; then echo "::error::${f} no fija la imagen base por digest"; exit 1; fi
              if [ "$fijado" != "$actual" ]; then echo "::warning::${f}: hay una imagen base más nueva; actualizar el digest en un PR"; fi
            done
          } | tee registro/2_digest.txt

      - name: Construcción de las 5 imágenes (sin publicar)
        run: |
          set -o pipefail
          for s in svc-profile svc-accounts svc-transfers svc-budgets svc-admin; do
            echo "== ${s}"
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load \
              -f "services/${s}/Dockerfile" -t "qwallet-${s}:prueba" services 2>&1 | tail -8
            docker image inspect "qwallet-${s}:prueba" --format '   usuario={{.Config.User}} tamaño={{.Size}} bytes'
          done 2>&1 | tee registro/3_imagenes.txt

      - name: Prueba de humo de cada imagen con el runtime real (EVD-3-15)
        run: |
          set -o pipefail
          estado=0
          {
            echo "== EVD-3-15 Prueba de humo: runtime de Lambda de la imagen + handler, sin AWS · $(date -u '+%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA::7}"
            echo "Evento: GET /me sin token. Esperado: 401 no_autenticado con cabeceras de seguridad."
            p=9101
            for s in svc-profile svc-accounts svc-transfers svc-budgets svc-admin; do
              python3 scripts/humo_lambda.py "$p" "$s" & srv=$!
              sleep 1
              docker run -d --name "humo-${s}" --network host \
                -e AWS_LAMBDA_RUNTIME_API="127.0.0.1:${p}" -e AWS_REGION=us-east-1 -e AWS_DEFAULT_REGION=us-east-1 \
                -e AWS_LAMBDA_FUNCTION_NAME="qwallet-${s}" -e AWS_LAMBDA_LOG_GROUP_NAME="/aws/lambda/qwallet-${s}" -e AWS_LAMBDA_LOG_STREAM_NAME=humo -e AWS_LAMBDA_FUNCTION_MEMORY_SIZE=256 -e AWS_LAMBDA_FUNCTION_VERSION='$LATEST' \
                -e AWS_ACCESS_KEY_ID=humo -e AWS_SECRET_ACCESS_KEY=humo -e SERVICIO="$s" \
                -e USER_POOL_ID=us-east-1_Humo00000 -e COGNITO_CLIENT_ID=humo0000000000000000000000 -e API_SCOPE=qwallet/api \
                -e TABLA_PERFILES=t -e TABLA_PIN=t -e TABLA_CUENTAS=t -e TABLA_MOVIMIENTOS=t -e TABLA_TRANSFERENCIAS=t \
                -e TABLA_BENEFICIARIOS=t -e TABLA_PRESUPUESTOS=t -e TABLA_AUDITORIA=t \
                "qwallet-${s}:prueba" >/dev/null
              if wait "$srv"; then
                # Log estructurado que dejó la Lambda (CTRL-09): sin cuerpo, sin cabeceras, con correlationId.
                docker logs "humo-${s}" 2>&1 | grep -o '{"nivel".*' | head -2 | sed 's/^/   log: /'
              else
                estado=1
                docker logs "humo-${s}" 2>&1 | tail -15 | sed 's/^/   log: /'
              fi 
              docker rm -f "humo-${s}" >/dev/null
              p=$((p + 1))
            done
            echo "Resultado: $([ $estado -eq 0 ] && echo PASA || echo FALLA)"
            exit $estado
          } 2>&1 | tee evidencias/EVD-3-15_humo_imagenes.txt

      - name: Trivy 0.75.0 sobre las imágenes (EVD-3-05)
        if: always()
        run: |
          set -o pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v0.75.0"
          curl -fsSLO "${base}/trivy_0.75.0_Linux-64bit.tar.gz"
          curl -fsSLO "${base}/trivy_0.75.0_checksums.txt"
          grep " trivy_0.75.0_Linux-64bit.tar.gz$" trivy_0.75.0_checksums.txt | sha256sum -c -
          tar xzf trivy_0.75.0_Linux-64bit.tar.gz trivy
          for s in svc-profile svc-accounts svc-transfers svc-budgets svc-admin; do
            ./trivy image --quiet --scanners vuln,secret --format json -o "trivy-${s}.json" "qwallet-${s}:prueba"
          done
          {
            echo "== EVD-3-05 Trivy 0.75.0 sobre las imágenes de las Lambdas · $(date -u '+%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA::7}"
            echo "Compuerta: falla con vulnerabilidades HIGH o CRITICAL que ya tienen corrección publicada."
            python3 scripts/trivy_resumen.py trivy-svc-*.json
          } 2>&1 | tee evidencias/EVD-3-05_trivy_imagenes.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: revision-estatica
          path: |
            evidencias/
            registro/
            trivy-*.json
          retention-days: 90

      - name: Resumen en el PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ job.status }}
        run: |
          {
            echo "## Revisión estática: ${RESULTADO}"
            echo "Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            for f in registro/*.txt; do
              [ -f "$f" ] || continue
              echo; echo "<details><summary>$(basename "$f")</summary>"; echo; echo '```'
              tail -c 12000 "$f"; echo '```'; echo "</details>"
            done
            echo; echo "<details><summary>Checkov (Terraform y Dockerfile)</summary>"; echo; echo '```'
            for f in evidencias/EVD-3-06_checkov_terraform.txt evidencias/EVD-3-06_checkov_dockerfile.txt; do
              [ -f "$f" ] && grep -E "scan results|Passed checks|FAILED|Check: " "$f" | head -60
            done
            echo '```'; echo "</details>"
            echo; echo "<details><summary>Trivy sobre las imágenes (EVD-3-05)</summary>"; echo; echo '```'
            [ -f evidencias/EVD-3-05_trivy_imagenes.txt ] && head -c 20000 evidencias/EVD-3-05_trivy_imagenes.txt
            echo '```'; echo "</details>"
            echo; echo "<details><summary>Prueba de humo de las imágenes (EVD-3-15)</summary>"; echo; echo '```'
            [ -f evidencias/EVD-3-15_humo_imagenes.txt ] && head -c 6000 evidencias/EVD-3-15_humo_imagenes.txt
            echo '```'; echo "</details>"
          } > comentario.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file comentario.md

  plan:
    name: Plan de Terraform (solo lectura)
    needs: revisar
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Bootstrap hecho
        id: listo
        env:
          CUENTA: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "$CUENTA" ]; then
            echo "::notice::Falta el secreto AWS_ACCOUNT_ID (bootstrap de CloudShell). Se omite el plan."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.listo.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.listo.outputs.ok == 'true'
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Diagnóstico OIDC (sin secretos)
        if: steps.listo.outputs.ok == 'true'
        env:
          CUENTA_SECRETO: ${{ secrets.AWS_ACCOUNT_ID }}
          ROL: qwallet-gha-plan
        run: |
          # Revisa que el secreto sea un número de cuenta de 12 dígitos (sin guiones ni espacios)
          # y muestra el "sub" del token de GitHub, que debe coincidir con la confianza del rol.
          # No imprime el token ni la cuenta completa.
          if printf '%s' "$CUENTA_SECRETO" | grep -Eq '^[0-9]{12}$'; then
            echo "AWS_ACCOUNT_ID: formato correcto, termina en ${CUENTA_SECRETO: -4}"
          else
            echo "::error::AWS_ACCOUNT_ID no son 12 dígitos (largo ${#CUENTA_SECRETO}). Debe ser solo el número, sin guiones ni espacios."
          fi
          echo "Rol a asumir: arn:aws:iam::****${CUENTA_SECRETO: -4}:role/${ROL}"
          token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          printf '%s' "$token" | cut -d. -f2 | python3 -c '
          import sys, json, base64
          p = sys.stdin.read().strip(); p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ("iss", "aud", "sub", "environment", "ref", "event_name"):
              print(f"{k}: {c.get(k)}")'

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.listo.outputs.ok == 'true'
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qwallet-gha-plan
          role-session-name: qwallet-plan-${{ github.run_id }}
          aws-region: us-east-1

      - name: Plan
        if: steps.listo.outputs.ok == 'true'
        env:
          CUENTA: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -o pipefail
          export TF_VAR_image_tag="svc-$(git rev-parse HEAD:services | cut -c1-12)"
          {
            terraform -chdir=infra init -no-color -backend-config="bucket=qwallet-tfstate-${CUENTA}"
            terraform -chdir=infra plan -no-color -lock=false -out=tfplan
            terraform -chdir=infra show -json tfplan > plan.json
            python3 infra/scripts/revisar_plan.py plan.json infra/destrucciones_aprobadas.txt
          } 2>&1 | sed "s/${CUENTA}/************/g" > plan.txt

      - name: Plan en el PR
        if: always() && steps.listo.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f plan.txt ]; then echo "No hubo plan (falló un paso anterior)."; exit 0; fi
          {
            echo "## Plan de Terraform"
            grep -E "^Plan:|No changes|Error|Bloqueado|Crear:" plan.txt | head -20 || true
            echo; echo "<details><summary>Salida completa</summary>"; echo; echo '```'
            tail -c 55000 plan.txt; echo '```'; echo "</details>"
          } > comentario.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file comentario.md

  desplegar:
    name: Despliegue en AWS (entorno dev)
    needs: revisar
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      CUENTA: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Diagnóstico OIDC (sin secretos)
        env:
          CUENTA_SECRETO: ${{ secrets.AWS_ACCOUNT_ID }}
          ROL: qwallet-gha-despliegue
        run: |
          # Revisa que el secreto sea un número de cuenta de 12 dígitos (sin guiones ni espacios)
          # y muestra el "sub" del token de GitHub, que debe coincidir con la confianza del rol.
          # No imprime el token ni la cuenta completa.
          if printf '%s' "$CUENTA_SECRETO" | grep -Eq '^[0-9]{12}$'; then
            echo "AWS_ACCOUNT_ID: formato correcto, termina en ${CUENTA_SECRETO: -4}"
          else
            echo "::error::AWS_ACCOUNT_ID no son 12 dígitos (largo ${#CUENTA_SECRETO}). Debe ser solo el número, sin guiones ni espacios."
          fi
          echo "Rol a asumir: arn:aws:iam::****${CUENTA_SECRETO: -4}:role/${ROL}"
          token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          printf '%s' "$token" | cut -d. -f2 | python3 -c '
          import sys, json, base64
          p = sys.stdin.read().strip(); p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ("iss", "aud", "sub", "environment", "ref", "event_name"):
              print(f"{k}: {c.get(k)}")'

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qwallet-gha-despliegue
          role-session-name: qwallet-despliegue-${{ github.run_id }}
          aws-region: us-east-1

      - name: Inicializar
        run: |
          set -o pipefail
          mkdir -p registro evidencias
          echo "TF_VAR_image_tag=svc-$(git rev-parse HEAD:services | cut -c1-12)" >> "$GITHUB_ENV"
          terraform -chdir=infra init -no-color -backend-config="bucket=qwallet-tfstate-${CUENTA}" 2>&1 | tee registro/1_init.txt

      - name: Marcar como sanos los recursos de infra/desmarcar.txt
        run: |
          set -o pipefail
          # Con el archivo vacío grep sale con 1; eso no es un error (no hay nada que desmarcar).
          { grep -Ev '^[[:space:]]*(#|$)' infra/desmarcar.txt || true; } | while read -r r; do
            if salida=$(terraform -chdir=infra untaint -no-color -allow-missing "$r" 2>&1); then
              echo "${r}: marcado como sano"
            elif echo "$salida" | grep -qi "not tainted"; then
              echo "${r}: no estaba marcado"
            else
              echo "$salida"; exit 1
            fi
          done 2>&1 | tee registro/1b_desmarcar.txt

      - name: Repositorios de imágenes (primero, para poder publicar)
        run: |
          set -o pipefail
          {
            terraform -chdir=infra plan -no-color -target=aws_ecr_repository.servicio -target=aws_ecr_repository_policy.servicio -target=aws_ecr_lifecycle_policy.servicio -out=ecr.tfplan
            terraform -chdir=infra show -json ecr.tfplan > ecr.json
            python3 infra/scripts/revisar_plan.py ecr.json infra/destrucciones_aprobadas.txt
            terraform -chdir=infra apply -no-color ecr.tfplan
          } 2>&1 | tee registro/2_ecr.txt

      - name: Publicar imágenes de los servicios
        run: |
          set -o pipefail
          REGISTRO="${CUENTA}.dkr.ecr.us-east-1.amazonaws.com"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRO"
          for s in svc-profile svc-accounts svc-transfers svc-budgets svc-admin; do
            if aws ecr describe-images --repository-name "qwallet/${s}" --image-ids imageTag="$TF_VAR_image_tag" >/dev/null 2>&1; then
              echo "${s}: la imagen ${TF_VAR_image_tag} ya existe"
              continue
            fi
            # Cada servicio con su propio Dockerfile (bloque 3): código real, no la imagen provisional.
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load \
              -f "services/${s}/Dockerfile" -t "${REGISTRO}/qwallet/${s}:${TF_VAR_image_tag}" services
            docker push --quiet "${REGISTRO}/qwallet/${s}:${TF_VAR_image_tag}"
            echo "${s}: publicada ${TF_VAR_image_tag}"
          done 2>&1 | tee registro/3_imagenes.txt

      - name: Plan completo y revisión de destrucciones
        run: |
          set -o pipefail
          {
            terraform -chdir=infra plan -no-color -out=tfplan
            terraform -chdir=infra show -json tfplan > plan.json
            python3 infra/scripts/revisar_plan.py plan.json infra/destrucciones_aprobadas.txt
          } 2>&1 | tee registro/4_plan.txt

      - name: Aplicar
        run: |
          set -o pipefail
          terraform -chdir=infra apply -no-color tfplan 2>&1 | tee registro/5_apply.txt

      - name: Verificar controles (EVD-3-11, EVD-3-12, EVD-3-13, EVD-5-04)
        env:
          SALIDA: evidencias
        run: |
          set -o pipefail
          infra/scripts/verificar_aws.sh 2>&1 | tee registro/6_verificacion.txt

      - name: Publicar resultado en el issue "Evidencias AWS"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ job.status }}
        run: |
          for f in registro/*.txt evidencias/*.txt; do
            [ -f "$f" ] && sed -i "s/${CUENTA}/************/g" "$f"
          done
          {
            echo "## Despliegue ${RESULTADO} · commit ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            for f in evidencias/*.txt registro/*.txt; do
              [ -f "$f" ] || continue
              echo; echo "<details><summary>$(basename "$f")</summary>"; echo; echo '```'
              tail -c 7000 "$f"; echo '```'; echo "</details>"
            done
          } > comentario.md
          head -c 64000 comentario.md > c.md
          n=$(gh issue list --repo "${{ github.repository }}" --state open --search "Evidencias AWS in:title" --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            n=$(gh issue create --repo "${{ github.repository }}" --title "Evidencias AWS" \
              --body "Resultados automáticos del despliegue y la verificación (sin número de cuenta)." | grep -o '[0-9]*$')
          fi
          gh issue comment "$n" --repo "${{ github.repository }}" --body-file c.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidencias-aws
          path: |
            evidencias/
            registro/
          retention-days: 90

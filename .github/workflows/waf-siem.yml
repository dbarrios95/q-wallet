# Prueba del WAF y del SIEM de punta a punta (bloque 5, secciones 5.1, 5.3 y 5.4).
#   1. Enciende el AWS WAF solo para esta prueba (terraform -target, waf_habilitado=true).
#   2. EVD-5-01 reglas configuradas · EVD-5-02 ataques acotados · EVD-5-02b regla que bloqueó cada uno.
#   3. Apaga el WAF SIEMPRE, aunque algo falle (costo: el WAF existe unos 15-20 minutos).
#   4. SIEM: EVD-5-06a reglas vs. muestras · denegaciones reales de IAM · EVD-5-06b alarmas que se
#      disparan y avisan por correo · EVD-5-06c correlación · EVD-5-07 gráficas del tablero.
# Corre a mano (Run workflow) o después del pentest de un merge del bloque 5.
# Usa el rol de despliegue (entorno dev, rama main) por OIDC; sin llaves guardadas.
name: waf-siem

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = WAF encendido + ataques + SIEM; consultas = solo leer logs, alarmas y diagnóstico (sin WAF ni ataques)"
        type: choice
        options: [completo, consultas]
        default: completo
  workflow_run:
    workflows: [pentest]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infra-refs/heads/main
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  TF_VAR_correo_alertas: ${{ secrets.ALERTAS_CORREO }}
  OBJETIVOS_WAF: >-
    -target=aws_wafv2_web_acl.api -target=aws_wafv2_web_acl_association.api
    -target=aws_wafv2_web_acl_logging_configuration.api -target=aws_cloudwatch_metric_alarm.waf_bloqueos

jobs:
  waf-siem:
    name: WAF encendido, ataques acotados y SIEM
    # A mano, o tras el pentest de un merge que mencione el bloque 5 o [prueba-waf].
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (contains(github.event.workflow_run.head_commit.message, 'bloque5') ||
        contains(github.event.workflow_run.head_commit.message, '[prueba-waf]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: dev
    permissions:
      contents: write
      id-token: write
      issues: write
    env:
      CUENTA: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qwallet-gha-despliegue
          role-session-name: qwallet-waf-siem-${{ github.run_id }}
          aws-region: us-east-1

      - name: Inicializar Terraform
        run: |
          mkdir -p evidencias registro
          echo "TF_VAR_image_tag=svc-$(git rev-parse HEAD:services | cut -c1-12)" >> "$GITHUB_ENV"
          terraform -chdir=infra init -no-color -backend-config="bucket=qwallet-tfstate-${CUENTA}" > registro/1_init.txt 2>&1
          echo "API_URL=$(terraform -chdir=infra output -raw api_url)" >> "$GITHUB_ENV"

      - name: Encender el WAF (solo para esta prueba)
        if: inputs.modo != 'consultas'
        run: |
          set -o pipefail
          {
            terraform -chdir=infra plan -no-color -var waf_habilitado=true $OBJETIVOS_WAF -out=on.tfplan
            terraform -chdir=infra show -json on.tfplan > on.json
            python3 infra/scripts/revisar_plan.py on.json infra/destrucciones_aprobadas.txt
            terraform -chdir=infra apply -no-color on.tfplan
          } 2>&1 | tee registro/2_encender_waf.txt
          echo "Esperando 90 s a que el WAF se propague..."
          sleep 90

      - name: EVD-5-01 reglas del WAF configuradas
        if: inputs.modo != 'consultas'
        run: |
          id=$(aws wafv2 list-web-acls --scope REGIONAL --query "WebACLs[?Name=='qwallet-api'].Id" --output text)
          {
            echo "EVD-5-01 AWS WAF: reglas configuradas (CTRL-17)"
            echo "Fecha: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            aws wafv2 get-web-acl --scope REGIONAL --name qwallet-api --id "$id" --query '{
              accionPorDefecto: keys(WebACL.DefaultAction)[0],
              capacidadUsadaWCU: WebACL.Capacity,
              reglas: WebACL.Rules[].{prioridad:Priority, nombre:Name,
                grupoAdministrado:Statement.ManagedRuleGroupStatement.Name,
                limitePorIp:Statement.RateBasedStatement.Limit,
                ventanaSeg:Statement.RateBasedStatement.EvaluationWindowSec,
                accion: Action && keys(Action)[0] || keys(OverrideAction)[0]}}' --output json
            echo
            echo "Asociado a la etapa v1 de API Gateway:"
            arn=$(aws wafv2 list-web-acls --scope REGIONAL --query "WebACLs[?Name=='qwallet-api'].ARN" --output text)
            aws wafv2 list-resources-for-web-acl --web-acl-arn "$arn" --resource-type API_GATEWAY --output text | sed 's/^/   /'
            echo
            echo "Registro del WAF (destino y campos redactados):"
            aws wafv2 get-logging-configuration --resource-arn "$arn" \
              --query 'LoggingConfiguration.{destino:LogDestinationConfigs[0], redactado:RedactedFields}' --output json
          } > evidencias/EVD-5-01_waf_reglas.txt 2>&1
          sed -i -E 's#arn:aws:[a-z0-9-]+:[a-z0-9-]*:[0-9*]{12}:#arn:aws:...:************:#g' evidencias/EVD-5-01_waf_reglas.txt
          cat evidencias/EVD-5-01_waf_reglas.txt

      - name: EVD-5-02 ataques acotados contra la API con el WAF encendido
        if: inputs.modo != 'consultas'
        run: bash infra/pruebas/waf_ataques.sh "$API_URL" evidencias

      - name: Esperar los logs y la alarma del WAF
        if: inputs.modo != 'consultas'
        run: |
          bash infra/pruebas/siem.sh esperar 480 qwallet-waf-bloqueos
          bash infra/pruebas/siem.sh waf evidencias
          bash infra/pruebas/siem.sh graficas evidencias waf
          aws cloudwatch describe-alarm-history --alarm-name qwallet-waf-bloqueos --max-records 10 \
            --query 'AlarmHistoryItems[].[Timestamp, HistoryItemType, HistorySummary]' --output text \
            | sed -E 's/arn:aws:sns:[^ ]*/[tema SNS qwallet-alertas]/g' > evidencias/waf_alarma_historial.txt || true

      - name: Apagar el WAF (siempre)
        if: always() && inputs.modo != 'consultas'
        run: |
          set -o pipefail
          {
            terraform -chdir=infra plan -no-color -var waf_habilitado=false $OBJETIVOS_WAF -out=off.tfplan
            terraform -chdir=infra show -json off.tfplan > off.json
            python3 infra/scripts/revisar_plan.py off.json infra/destrucciones_aprobadas.txt
            terraform -chdir=infra apply -no-color off.tfplan
            echo "WAF en la cuenta después de apagar:"
            aws wafv2 list-web-acls --scope REGIONAL --query 'WebACLs[].Name' --output text
          } 2>&1 | tee registro/3_apagar_waf.txt

      - name: SIEM - reglas, denegaciones reales y alarmas
        if: always() && inputs.modo != 'consultas'
        run: |
          bash infra/pruebas/siem.sh reglas evidencias
          bash infra/pruebas/siem.sh denegaciones evidencias
          # CloudTrail tarda de 5 a 15 minutos en entregar a CloudWatch Logs.
          bash infra/pruebas/siem.sh esperar 1200 qwallet-aws-no-autorizado qwallet-rafaga-401
          bash infra/pruebas/siem.sh alarmas evidencias
          bash infra/pruebas/siem.sh consultas evidencias
          bash infra/pruebas/siem.sh graficas evidencias
          cat evidencias/waf_alarma_historial.txt >> evidencias/EVD-5-06b_alarmas.txt 2>/dev/null || true
          rm -f evidencias/waf_alarma_historial.txt

      - name: Solo consultas (logs, alarmas y diagnóstico de las últimas 24 h)
        if: always() && inputs.modo == 'consultas'
        env:
          MIN: "1440"
          HORAS: "24"
        run: |
          bash infra/pruebas/siem.sh waf evidencias
          bash infra/pruebas/siem.sh consultas evidencias
          bash infra/pruebas/siem.sh alarmas evidencias
          bash infra/pruebas/siem.sh diagnostico evidencias

      - name: Publicar evidencias
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp registro/3_apagar_waf.txt evidencias/registro_apagar_waf.txt 2>/dev/null || true
          bash scripts/publicar_evidencias.sh evidencias "Evidencias WAF y SIEM" waf-siem "${{ job.status }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidencias-waf-siem
          path: |
            evidencias/
            registro/
          retention-days: 90

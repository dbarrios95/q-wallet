# Flujo DevSecOps de Q-Wallet (Fase 3 del enunciado; secciones 3.4, 3.5 y 4.6 del informe).
# Corre en cada PR, en cada cambio de main, cada lunes (gestión continua, 5.5) y a mano.
#   pruebas    Pruebas unitarias por control (vitest) y compilación de las 5 Lambdas  (EVD-3-14)
#   semgrep    SAST con reglas públicas + reglas propias .semgrep/qwallet.yml          (EVD-3-02)
#   codeql     SAST semántico de GitHub (security-extended)                             (EVD-3-03)
#   sca        npm audit con compuerta de excepciones + Trivy (dependencias y SBOM)     (EVD-3-04)
#   secretos   gitleaks sobre todo el historial                                         (EVD-3-09)
#   dependency-check / snyk: solo si existen los secretos NVD_API_KEY / SNYK_TOKEN.
#   resumen    Tabla de resultados en el PR                                             (EVD-3-01)
# Compuertas (CTRL-10): el flujo falla con hallazgos SAST graves, con avisos SCA High o
# Critical sin excepción vigente, con secretos en el historial o con una prueba en rojo.
# Herramientas descargadas por versión exacta y verificadas por suma SHA-256; acciones de
# terceros fijadas por SHA del commit (CONTEXTO, sección 3.1).
name: devsecops

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 1" # lunes 05:17 hora de Guatemala
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.21.0"
  SEMGREP_VERSION: "1.179.0"
  TRIVY_VERSION: "0.75.0"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  pruebas:
    name: Pruebas unitarias por control (vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Instalar, revisar tipos, probar y empaquetar
        working-directory: services
        run: |
          set -o pipefail
          mkdir -p ../evidencias
          npm ci --ignore-scripts --no-audit --no-fund
          {
            echo "== EVD-3-14 Pruebas unitarias de los controles (vitest) · $(date -u '+%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA::7}"
            echo "== tsc --noEmit (TypeScript estricto)"
            npx tsc --noEmit
            echo "== vitest"
            npx vitest run --reporter=verbose
            echo "== esbuild (un archivo por Lambda)"
            node esbuild.mjs
            ls -la dist/*/index.mjs
          } 2>&1 | tee ../evidencias/EVD-3-14_pruebas_controles.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evd-pruebas
          path: evidencias/
          retention-days: 90

  semgrep:
    name: SAST Semgrep
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep ${{ env.SEMGREP_VERSION }}
        run: |
          set -o pipefail
          mkdir -p evidencias
          pip install --quiet --break-system-packages "semgrep==${SEMGREP_VERSION}"
          # Reglas públicas (OWASP Top 10, Node.js, TypeScript, React, secretos) + reglas propias.
          semgrep scan --metrics=off \
            --config p/owasp-top-ten --config p/nodejs --config p/typescript --config p/javascript \
            --config p/react --config p/secrets --config p/dockerfile --config .semgrep/qwallet.yml \
            --exclude node_modules --exclude dist --exclude services/hola \
            --sarif-output=semgrep.sarif --text-output=semgrep.txt services mobile || true
          {
            echo "== EVD-3-02 Semgrep ${SEMGREP_VERSION} · $(date -u '+%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA::7}"
            echo "Reglas: p/owasp-top-ten, p/nodejs, p/typescript, p/javascript, p/react, p/secrets, p/dockerfile y .semgrep/qwallet.yml"
            cat semgrep.txt
            echo "== Compuerta"
            python3 scripts/sarif_compuerta.py Semgrep semgrep.sarif
          } 2>&1 | tee evidencias/EVD-3-02_semgrep.txt
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evd-semgrep
          path: |
            evidencias/
            semgrep.sarif
          retention-days: 90

  codeql:
    name: SAST CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths:
              - services
              - mobile
            paths-ignore:
              - "**/node_modules"
              - "**/dist"
              - services/hola
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: codeql
          output: sarif-codeql
      - name: Compuerta CodeQL
        run: |
          set -o pipefail
          mkdir -p evidencias
          {
            echo "== EVD-3-03 CodeQL (security-extended) · $(date -u '+%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA::7}"
            python3 scripts/sarif_compuerta.py CodeQL sarif-codeql/*.sarif
          } 2>&1 | tee evidencias/EVD-3-03_codeql.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evd-codeql
          path: |
            evidencias/
            sarif-codeql/
          retention-days: 90

  sca:
    name: SCA (npm audit y Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Instalar Trivy ${{ env.TRIVY_VERSION }} (verificado por SHA-256)
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version
      - name: npm audit con compuerta de excepciones
        run: |
          set -o pipefail
          mkdir -p evidencias
          estado=0
          {
            echo "== EVD-3-04 SCA · $(date -u '+%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA::7}"
            for d in services mobile; do
              echo; echo "== npm audit: ${d} (package-lock.json)"
              (cd "$d" && npm audit --json > "../audit-${d}.json") || true
              python3 scripts/sca_compuerta.py "audit-${d}.json" "${d}/excepciones-sca.json" || estado=1
            done
            exit $estado
          } 2>&1 | tee evidencias/EVD-3-04_sca_npm_audit.txt
      - name: Trivy (dependencias y SBOM)
        if: always()
        run: |
          set -o pipefail
          {
            echo "== EVD-3-04 Trivy ${TRIVY_VERSION}: vulnerabilidades en dependencias (informativo; la compuerta es npm audit)"
            for d in services mobile; do
              echo; echo "== ${d}"
              trivy fs --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL --format table --exit-code 0 "${d}/package-lock.json"
            done
          } 2>&1 | tee evidencias/EVD-3-04_sca_trivy.txt
          # Inventario de componentes (SBOM CycloneDX) para la gestión continua de vulnerabilidades.
          trivy fs --format cyclonedx --output evidencias/sbom-services.cdx.json services/package-lock.json
          trivy fs --format cyclonedx --output evidencias/sbom-mobile.cdx.json mobile/package-lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evd-sca
          path: |
            evidencias/
            audit-*.json
          retention-days: 90

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks ${{ env.GITLEAKS_VERSION }} sobre todo el historial
        run: |
          set -o pipefail
          mkdir -p evidencias
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          {
            echo "== EVD-3-09 gitleaks ${GITLEAKS_VERSION} · $(date -u '+%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA::7}"
            echo "Commits revisados: $(git rev-list --count HEAD)"
            ./gitleaks git --redact --no-banner -v .
          } 2>&1 | tee evidencias/EVD-3-09_gitleaks.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evd-secretos
          path: evidencias/
          retention-days: 90

  dependency-check:
    name: SCA OWASP Dependency-Check (opcional)
    runs-on: ubuntu-24.04
    steps:
      - name: ¿Hay llave de NVD?
        id: llave
        env:
          NVD: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD" ]; then
            echo "::notice::Sin secreto NVD_API_KEY: Dependency-Check se omite (sin llave tarda horas por el límite de la NVD)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.llave.outputs.ok == 'true'
        with:
          persist-credentials: false
      - name: Dependency-Check 12.1.0
        if: steps.llave.outputs.ok == 'true'
        env:
          NVD: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p evidencias odc
          docker run --rm -e NVD -v "$PWD:/src:ro" -v "$PWD/odc:/report" owasp/dependency-check:12.1.0 \
            --project q-wallet --scan /src/services/package-lock.json --scan /src/mobile/package-lock.json \
            --nvdApiKey "$NVD" --format HTML --format JSON --out /report --failOnCVSS 7 \
            2>&1 | tail -60 | tee evidencias/EVD-3-04_dependency_check.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.llave.outputs.ok == 'true'
        with:
          name: evd-dependency-check
          path: |
            evidencias/
            odc/
          retention-days: 90

  snyk:
    name: SCA Snyk (opcional)
    runs-on: ubuntu-24.04
    steps:
      - name: ¿Hay token de Snyk?
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::notice::Sin secreto SNYK_TOKEN: Snyk se omite."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Snyk CLI 1.1307.4
        if: steps.token.outputs.ok == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p evidencias
          estado=0
          for d in services mobile; do
            npx --yes snyk@1.1307.4 test --file="${d}/package-lock.json" --severity-threshold=high 2>&1 \
              | tee -a evidencias/EVD-3-04_snyk.txt || estado=1
          done
          exit $estado
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.token.outputs.ok == 'true'
        with:
          name: evd-snyk
          path: evidencias/
          retention-days: 90

  resumen:
    name: Resumen DevSecOps
    needs: [pruebas, semgrep, codeql, sca, secretos, dependency-check, snyk]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evd-*
          path: evd
          merge-multiple: true
      - name: Tabla de resultados (EVD-3-01)
        env:
          GH_TOKEN: ${{ github.token }}
          R_PRUEBAS: ${{ needs.pruebas.result }}
          R_SEMGREP: ${{ needs.semgrep.result }}
          R_CODEQL: ${{ needs.codeql.result }}
          R_SCA: ${{ needs.sca.result }}
          R_SECRETOS: ${{ needs.secretos.result }}
          R_ODC: ${{ needs.dependency-check.result }}
          R_SNYK: ${{ needs.snyk.result }}
        run: |
          {
            echo "## DevSecOps · commit ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "| Etapa | Herramienta | Resultado |"
            echo "|---|---|---|"
            echo "| Pruebas por control | vitest 5.0.3 + tsc 6.0.3 | ${R_PRUEBAS} |"
            echo "| SAST | Semgrep ${SEMGREP_VERSION:-1.179.0} | ${R_SEMGREP} |"
            echo "| SAST | CodeQL (security-extended) | ${R_CODEQL} |"
            echo "| SCA | npm audit + compuerta / Trivy | ${R_SCA} |"
            echo "| Secretos | gitleaks | ${R_SECRETOS} |"
            echo "| SCA (opcional) | OWASP Dependency-Check 12.1.0 | ${R_ODC} |"
            echo "| SCA (opcional) | Snyk CLI 1.1307.4 | ${R_SNYK} |"
            echo
            echo "Evidencias (EVD-3-01 a EVD-3-04, EVD-3-09, EVD-3-14) en los artefactos de la ejecución y abajo."
            for f in evd/evidencias/*.txt; do
              [ -f "$f" ] || continue
              echo; echo "<details><summary>$(basename "$f")</summary>"; echo; echo '```'
              # Las líneas largas de las tablas se cortan; el archivo completo queda en el artefacto.
              cut -c1-220 "$f" | tail -c 9000; echo '```'; echo "</details>"
            done
          } > resumen.md
          head -c 64000 resumen.md > c.md
          head -c 20000 resumen.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file c.md
            fi
          else
            # main y la revisión semanal dejan la evidencia en el issue "Evidencias DevSecOps" (5.5).
            n=$(gh issue list --repo "${{ github.repository }}" --state open --search "Evidencias DevSecOps in:title" --json number --jq '.[0].number')
            if [ -z "$n" ]; then
              n=$(gh issue create --repo "${{ github.repository }}" --title "Evidencias DevSecOps" \
                --body "Resultados automáticos del flujo DevSecOps en main y de la revisión semanal." | grep -o '[0-9]*$')
            fi
            gh issue comment "$n" --repo "${{ github.repository }}" --body-file c.md
          fi
          for r in "$R_PRUEBAS" "$R_SEMGREP" "$R_CODEQL" "$R_SCA" "$R_SECRETOS" "$R_ODC" "$R_SNYK"; do
            [ "$r" = "failure" ] && exit 1
          done
          exit 0
